name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: kainos-jobs-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run check

    - name: Generate Prisma Client
      run: npx prisma generate
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/db
    
    - name: Check Prisma Client
      run: ls -l node_modules/.prisma/client

    - name: Create .env.test
      run: |
        cat > .env.test << EOF
        PORT=3001
        DB_USER=testuser
        DB_PASSWORD=testpass
        DB_HOST=localhost
        DB_PORT=5432
        DB_NAME=kainos-jobs-test
        DB_SCHEMA=public
        EOF

    - name: Run Prisma migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/kainos-jobs-test?schema=public

    - name: Run tests
      run: npm run test:coverage