services:
  backend:
    build: .
    image: academyacrj3r5dv.azurecr.io/ethan-campbell/team1-back-app:latest
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD:-}@host.docker.internal:5432/${DB_NAME:-kainos-jobs-test}?schema=${DB_SCHEMA:-public}
      JWT_EXPIRES_IN: 24h
    extra_hosts:
      - "host.docker.internal:host-gateway"
